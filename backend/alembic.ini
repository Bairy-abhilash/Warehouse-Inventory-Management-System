# ─────────────────────────────────────────────────────
# Alembic Configuration
# ─────────────────────────────────────────────────────
# This file tells Alembic:
#   - where the migration scripts live (script_location)
#   - how to connect to the database (sqlalchemy.url)
#
# We do NOT hardcode the database URL here. Instead, the
# env.py file reads DATABASE_URL from your .env at runtime,
# which keeps passwords out of this committed config file.

[alembic]
# Folder that contains migration versions
script_location = alembic

# Template used when generating new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Maximum length of the slug generated from the migration message
truncate_slug_length = 40

# Where to prepend sys.path so env.py can import our app
prepend_sys_path = .

# Timezone used for the migration filename timestamps
timezone = UTC

[post_write_hooks]
# (No hooks configured)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
